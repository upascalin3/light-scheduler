<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Light Scheduler</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #e0f7fa, #f0f2f5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      color: #2c3e50;
      margin-bottom: 20px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    form {
      background: #ffffff;
      padding: 25px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 300px;
      display: flex;
      flex-direction: column;
    }

    input, button {
      margin: 12px 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #26a69a;
      outline: none;
      box-shadow: 0 0 5px #26a69a55;
    }

    button {
      background: #26a69a;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    button:hover {
      background: #2bbbad;
    }

    .bulb {
      margin-top: 30px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #b0bec5;
      box-shadow: 0 0 10px #90a4ae;
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }

    .on {
      background: #fff176;
      box-shadow: 0 0 40px #fff176, 0 0 80px #fff59d;
    }
  </style>
</head>
<body>

  <h1>Light Scheduler</h1>
  <form id="schedulerForm">
    <input type="time" id="onTime" required>
    <input type="time" id="offTime" required>
    <button type="submit">Submit Schedule</button>
  </form>

  <div class="bulb" id="lightBulb"></div>

  <script>
    const form = document.getElementById('schedulerForm');
    const ws = new WebSocket('ws://localhost:8765');
    const bulb = document.getElementById('lightBulb');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const onTime = document.getElementById('onTime').value;
      const offTime = document.getElementById('offTime').value;
      const schedule = { on: onTime, off: offTime };
      ws.send(JSON.stringify(schedule));
      alert('Schedule sent!');
    });

    ws.onmessage = (message) => {
      if (message.data === '1') {
        bulb.classList.add('on');
      } else if (message.data === '0') {
        bulb.classList.remove('on');
      }
    };
  </script>

</body>
</html>
